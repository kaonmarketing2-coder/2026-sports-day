<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}웰메이트{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --kaon-orange:      #FF7B0F;
      --kaon-orange-dark: #cc6200;
      --kaon-black:       #000000;
      --kaon-dark:        #3A3B4D;
      --kaon-dark2:       #2e2f3e;
      --kaon-gray:        #B0B0B0;
      --kaon-bg:          #f2f3f5;
    }

    body { background: var(--kaon-bg); font-size: 13px; }

    /* ── 네비게이션 ── */
    .navbar {
      background: var(--kaon-dark) !important;
      padding-top: 0; padding-bottom: 0;
      border-bottom: 2px solid var(--kaon-orange);
    }
    .navbar-brand {
      padding: 8px 0; display: flex; align-items: center; gap: 10px;
    }
    .kaon-logo { height: 28px; width: auto; }

    .nav-link {
      color: rgba(255,255,255,.75) !important;
      font-size: .84rem; padding: 14px 14px !important;
      border-bottom: 2px solid transparent;
    }
    .nav-link:hover  { color: #fff !important; background: rgba(255,255,255,.07); }
    .nav-link.active { color: #fff !important; border-bottom: 2px solid var(--kaon-orange); }

    /* ── 카드 ── */
    .card {
      border: none; border-radius: 10px;
      box-shadow: 0 1px 6px rgba(0,0,0,.07);
    }

    /* ── 버튼 ── */
    .btn-primary {
      background: var(--kaon-orange); border-color: var(--kaon-orange);
    }
    .btn-primary:hover, .btn-primary:focus {
      background: var(--kaon-orange-dark); border-color: var(--kaon-orange-dark);
    }
    .btn-outline-primary {
      color: var(--kaon-orange); border-color: var(--kaon-orange);
    }
    .btn-outline-primary:hover {
      background: var(--kaon-orange); border-color: var(--kaon-orange); color: #fff;
    }

    /* ── 테이블 ── */
    .table thead th { background: var(--kaon-dark) !important; color: #fff; font-weight: 600; }
    .table-hover tbody tr:hover { background: #fff3e8 !important; }
    .table { border-radius: 8px; overflow: hidden; }

    /* ── 페이지 타이틀 ── */
    .page-title { font-weight: 700; font-size: 1.1rem; margin-bottom: 1rem; color: var(--kaon-dark); }

    /* ── 배지 ── */
    .badge.bg-primary { background: var(--kaon-orange) !important; }

    /* ── 링크 ── */
    a { color: var(--kaon-orange); }
    a:hover { color: var(--kaon-orange-dark); }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
<nav class="navbar navbar-expand-lg mb-4 px-3">
  <a class="navbar-brand" href="/">
    <img src="/static/kaon_logo.png" alt="KAON" class="kaon-logo">
    <span style="font-size:.78rem;color:rgba(255,255,255,.5);font-weight:400;letter-spacing:.05em;margin-left:4px">웰메이트</span>
  </a>
  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
    <span class="navbar-toggler-icon"></span>
  </button>
  <div class="collapse navbar-collapse" id="navMenu">
    <ul class="navbar-nav me-auto">
      <li class="nav-item"><a class="nav-link {% if request.path=='/' %}active{% endif %}" href="/">대시보드</a></li>
      <li class="nav-item"><a class="nav-link {% if request.path.startswith('/employees') %}active{% endif %}" href="/employees">직원 DB</a></li>
      <li class="nav-item"><a class="nav-link {% if request.path=='/org' %}active{% endif %}" href="/org">조직도</a></li>
      <li class="nav-item"><a class="nav-link {% if request.path=='/resigned' %}active{% endif %}" href="/resigned">퇴사자</a></li>
      <li class="nav-item"><a class="nav-link" href="/wellmate/new">+ 매칭 등록</a></li>
    </ul>
    <a class="btn btn-sm" href="/logout"
       style="color:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.3);border-radius:6px;padding:4px 12px">
      로그아웃
    </a>
  </div>
</nav>

<div class="container-fluid px-4 px-lg-5" style="max-width:1600px;margin:0 auto">
  {% with msgs = get_flashed_messages() %}
    {% if msgs %}
      {% for msg in msgs %}
        <div class="alert alert-success alert-dismissible fade show py-2" role="alert">
          {{ msg }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
