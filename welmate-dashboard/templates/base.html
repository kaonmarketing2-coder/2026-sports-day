<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}웰메이트{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --kaon-orange: #FF7B0F;
      --kaon-black:  #000000;
      --kaon-dark:   #3A3B4D;
      --kaon-gray:   #B0B0B0;
    }
    body { background: #f2f3f5; font-size: 13px; }

    /* ── 네비게이션 ── */
    .navbar { background: var(--kaon-dark) !important; padding-top: 0; padding-bottom: 0; }
    .navbar-brand {
      font-weight: 800; font-size: 1rem; padding: 10px 0;
      display: flex; align-items: center; gap: 10px;
    }
    /* KAON 로고 SVG 인라인 */
    .kaon-logo-svg { height: 26px; width: auto; }

    .nav-link { color: rgba(255,255,255,.75) !important; font-size: .84rem; padding: 14px 12px !important; }
    .nav-link:hover  { color: #fff !important; background: rgba(255,255,255,.08); }
    .nav-link.active { color: #fff !important; border-bottom: 2px solid var(--kaon-orange); }

    .card { border: none; border-radius: 12px; box-shadow: 0 1px 6px rgba(0,0,0,.08); }
    .btn-primary { background: var(--kaon-orange); border-color: var(--kaon-orange); }
    .btn-primary:hover { background: #e06800; border-color: #e06800; }
    .page-title { font-weight: 700; font-size: 1.1rem; margin-bottom: 1rem; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
<nav class="navbar navbar-expand-lg mb-4 px-3">
  <a class="navbar-brand text-white" href="/">
    <!-- KAON 로고 (다크 배경용 — K·A·N 흰색, 파워 심볼 오렌지) -->
    <svg class="kaon-logo-svg" viewBox="0 0 220 60" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- K -->
      <path d="M0 4h10v22l18-22h13L22 32l21 24H30L10 32v24H0V4z" fill="#ffffff"/>
      <!-- A -->
      <path d="M55 56L73 4h10l18 52H91l-4-12H69l-4 12H55zm17-20h12l-6-18-6 18z" fill="#ffffff"/>
      <!-- power symbol circle (O) -->
      <g transform="translate(110,4)">
        <circle cx="26" cy="26" r="22" stroke="#FF7B0F" stroke-width="7" fill="none" stroke-dasharray="110 40" stroke-dashoffset="-20"/>
        <line x1="26" y1="4" x2="26" y2="20" stroke="#FF7B0F" stroke-width="7" stroke-linecap="round"/>
      </g>
      <!-- N -->
      <path d="M162 4h10l24 36V4h10v52h-10L172 20v36h-10V4z" fill="#ffffff"/>
    </svg>
    <span style="font-size:.8rem;color:rgba(255,255,255,.55);font-weight:400;letter-spacing:.04em">웰메이트</span>
  </a>
  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
    <span class="navbar-toggler-icon"></span>
  </button>
  <div class="collapse navbar-collapse" id="navMenu">
    <ul class="navbar-nav me-auto">
      <li class="nav-item"><a class="nav-link {% if request.path=='/' %}active{% endif %}" href="/">대시보드</a></li>
      <li class="nav-item"><a class="nav-link {% if request.path.startswith('/employees') %}active{% endif %}" href="/employees">직원 DB</a></li>
      <li class="nav-item"><a class="nav-link {% if request.path=='/org' %}active{% endif %}" href="/org">조직도</a></li>
      <li class="nav-item"><a class="nav-link {% if request.path=='/resigned' %}active{% endif %}" href="/resigned">퇴사자</a></li>
      <li class="nav-item"><a class="nav-link" href="/wellmate/new">+ 매칭 등록</a></li>
    </ul>
    <a class="btn btn-sm btn-outline-light" href="/logout">로그아웃</a>
  </div>
</nav>

<div class="container-fluid px-4">
  {% with msgs = get_flashed_messages() %}
    {% if msgs %}
      {% for msg in msgs %}
        <div class="alert alert-success alert-dismissible fade show py-2" role="alert">
          {{ msg }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
